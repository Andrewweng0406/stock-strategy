name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      REDIS_URL: ""
      MOOMOO_ENABLED: "false"
      YFINANCE_FALLBACK_ENABLED: "false"
      SYNTHETIC_MARKET_DATA_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m py_compile app/*.py app/services/*.py

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend Build And E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run browser regression tests
        working-directory: web
        run: npm run test:e2e

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --omit=optional
